name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nocturne (device + simulator)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build-device/Build/Products/Release-iphoneos/Nocturne.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/Nocturne.app
          cd ipa
          /usr/bin/zip -qry Nocturne-unsigned.ipa Payload
          test -s Nocturne-unsigned.ipa

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-iOS-Device-Unsigned-IPA
          path: ipa/Nocturne-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-iOS-Simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/Nocturne.app
          if-no-files-found: error
          retention-days: 14
