name: Nocturne
options:
  bundleIdPrefix: com.nocturne
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - Sources/App
    dependencies:
      - target: NocturneClip
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocturne.app
        PRODUCT_NAME: Nocturne
        INFOPLIST_KEY_CFBundleDisplayName: Nocturne
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  NocturneClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Sources/Clip
    entitlements:
      path: Sources/Clip/NocturneClip.entitlements
      properties:
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.parent-application-identifiers:
          - "$(AppIdentifierPrefix)com.nocturne.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocturne.app.Clip
        PRODUCT_NAME: NocturneClip
        INFOPLIST_KEY_CFBundleDisplayName: Nocturne Preview
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
