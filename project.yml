name: Nocturne
options:
  bundleIdPrefix: com.nocturne
  deploymentTarget:
    iOS: "17.0"
targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocturne.app
        PRODUCT_NAME: Nocturne
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nocturne
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
